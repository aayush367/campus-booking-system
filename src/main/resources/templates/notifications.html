<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | Campus Booking System</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    .nc-wrap { max-width: 780px; margin: 32px auto; padding: 0 20px; }
    .nc-head { display:flex; align-items:center; justify-content:space-between;
               gap:16px; margin-bottom:20px; flex-wrap:wrap; }
    .nc-head h1 { font-size: 26px; }
    .nc-head .sub { color:#64748b; font-size:14px; }
    .nc-actions { display:flex; gap:10px; }
    .nc-btn { padding:8px 14px; border-radius:7px; border:1px solid #d4d9e2;
              background:#fff; font-weight:600; cursor:pointer; text-decoration:none;
              color:#1f2937; font-size:14px; }
    .nc-btn.primary { background:#4f46e5; border-color:#4f46e5; color:#fff; }
    .nc-list { display:flex; flex-direction:column; gap:10px; }
    .nc-item { display:flex; gap:14px; padding:16px; background:#fff;
               border:1px solid #e6e9f0; border-radius:10px; }
    .nc-item.unread { border-left:4px solid #4f46e5; background:#eef2ff; }
    .nc-icon { width:38px; height:38px; border-radius:50%; flex-shrink:0;
               display:flex; align-items:center; justify-content:center; color:#fff; }
    .nc-icon.approved { background:#22a35a; }
    .nc-icon.rejected { background:#dc4b40; }
    .nc-icon.pending  { background:#e8a33d; }
    .nc-icon.info     { background:#64748b; }
    .nc-item strong { display:block; margin-bottom:3px; }
    .nc-item p { color:#475569; font-size:14px; margin-bottom:4px; }
    .nc-item small { color:#94a3b8; font-size:12px; }
    .nc-empty { padding:50px; text-align:center; color:#7b8392; background:#fff;
                border:1px solid #e6e9f0; border-radius:10px; }
  </style>
</head>

<body>

<div class="nc-wrap">

  <div class="nc-head">
    <div>
      <h1>Notifications</h1>
      <span class="sub" th:text="${(unreadCount != null ? unreadCount : 0) + ' unread'}">0 unread</span>
    </div>
    <div class="nc-actions">
      <form th:action="@{/notifications/read-all}" method="post" style="display:inline;">
        <button type="submit" class="nc-btn">Mark all read</button>
      </form>
      <a th:href="${session.accountType != null and #strings.equalsIgnoreCase(session.accountType,'ADMIN') ? '/admin/dashboard'
                    : (session.accountType != null and (#strings.equalsIgnoreCase(session.accountType,'FACULTY') or #strings.equalsIgnoreCase(session.accountType,'STAFF')) ? '/faculty/dashboard' : '/dashboard')}"
         class="nc-btn primary">Back to dashboard</a>
    </div>
  </div>

  <div class="nc-empty" th:if="${notifications == null or #lists.isEmpty(notifications)}">
    You have no notifications yet.
  </div>

  <div class="nc-list" th:unless="${notifications == null or #lists.isEmpty(notifications)}">

    <div class="nc-item"
         th:each="note : ${notifications}"
         th:classappend="${note.read} ? '' : 'unread'">

      <div class="nc-icon"
           th:classappend="${#strings.toLowerCase(note.type)}">
        <i class="fa-solid fa-check" th:if="${note.type == 'APPROVED'}"></i>
        <i class="fa-solid fa-xmark" th:if="${note.type == 'REJECTED'}"></i>
        <i class="fa-solid fa-exclamation" th:if="${note.type == 'PENDING'}"></i>
        <i class="fa-regular fa-bell"
           th:if="${note.type != 'APPROVED' and note.type != 'REJECTED' and note.type != 'PENDING'}"></i>
      </div>

      <div>
        <strong th:text="${note.title}">Title</strong>
        <p th:text="${note.message}">Message</p>
        <small th:text="${#temporals.format(note.createdAt, 'dd MMM yyyy, HH:mm')}">time</small>
      </div>

    </div>

  </div>

</div>

</body>
</html>
